# Production override. Use together with the root file:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
# Requires PUBLIC_HOST (DNS name pointing at this VM) in the shell or in .env.
name: kep-brain

services:
  caddy:
    image: caddy:2.8.4-alpine
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST to the public DNS name}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      # The admin API listens on localhost:2019 inside the container; it answers once the config is loaded.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [edge]
    restart: unless-stopped

  falkordb:
    ports: !reset []

  api:
    ports: !reset []
    environment:
      ENV: prod
      TRUST_PROXY: "true"
      CORS_ORIGINS: https://${PUBLIC_HOST:?set PUBLIC_HOST to the public DNS name}
      PUBLIC_BASE_URL: https://${PUBLIC_HOST}

  mcp:
    ports: !reset []
    environment:
      # Host and Origin allow-list of the MCP transport: Caddy forwards /mcp with the public Host header.
      PUBLIC_BASE_URL: https://${PUBLIC_HOST}

  web:
    ports: !reset []
    environment:
      PUBLIC_BASE_URL: https://${PUBLIC_HOST}

volumes:
  caddy-data:
  caddy-config:
