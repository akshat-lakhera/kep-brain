repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^apps/api/
      - id: ruff-format
        files: ^apps/api/
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.9.10
    hooks:
      - id: prettier
        files: ^apps/web/.*\.(ts|tsx|css|json|mjs)$
