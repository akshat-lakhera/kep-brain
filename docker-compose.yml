# KEP Brain — development stack.
# Host ports: FalkorDB on 127.0.0.1:6380 (6379 is taken on the dev host), browser UI on 127.0.0.1:3001,
# api on 8000, web on 3000. Copy .env.example to .env and set FALKORDB_PASSWORD first.
name: kep-brain

services:
  falkordb:
    image: falkordb/falkordb:v4.22.0@sha256:4ac83f55062d364dcf151692635138b0bd2e12578019a56eb86ef53d067b116b
    environment:
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD:?set FALKORDB_PASSWORD in .env}
      REDIS_ARGS: >-
        --requirepass ${FALKORDB_PASSWORD:?set FALKORDB_PASSWORD in .env}
        --appendonly yes --appendfsync everysec --save 300 10
        --maxmemory 2gb --maxmemory-policy noeviction
      FALKORDB_ARGS: "TIMEOUT_DEFAULT 2000 TIMEOUT_MAX 60000 RESULTSET_SIZE 10000"
    ports:
      - "127.0.0.1:6380:6379"
      - "127.0.0.1:3001:3000"
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$FALKORDB_PASSWORD\" --no-auth-warning PING | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    restart: unless-stopped

  api:
    build: ./apps/api
    env_file: .env
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      falkordb:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [edge, data]
    restart: unless-stopped

  worker:
    build: ./apps/api
    env_file: .env
    entrypoint: ["python", "-m", "app.worker"]
    command: ["schedule", "--interval-minutes", "1440"]
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      REPO_CACHE_DIR: /repo_cache
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    depends_on:
      falkordb:
        condition: service_healthy
    volumes:
      - ${REPO_CACHE_HOST:-repo_cache}:/repo_cache
    healthcheck:
      disable: true
    networks: [data]
    restart: unless-stopped

  mcp:
    build: ./apps/api
    env_file: .env
    command: ["python", "-m", "app.mcp"]
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      MCP_TOKEN: ${MCP_TOKEN:?set MCP_TOKEN in .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8765), 3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      falkordb:
        condition: service_healthy
    ports:
      - "127.0.0.1:8765:8765"
    networks: [edge, data]
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        API_INTERNAL_URL: http://api:8000
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [edge]
    restart: unless-stopped

volumes:
  falkordb-data:
  repo_cache:

networks:
  edge:
  data:
