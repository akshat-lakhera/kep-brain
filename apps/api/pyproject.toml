[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Akshat Lakhera", email = "akshatlnct2024@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "falkordb==1.7.1",
    "fastapi==0.143.0",
    "httpx==0.28.1",
    "openai>=3.31.0",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "pyyaml>=6.0.3",
    "structlog==26.1.0",
    "uvicorn==0.54.0",
]

[project.scripts]
app = "app:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]
