[project]
name = "app"
version = "0.1.0"
description = "KEP Brain API, worker and MCP server: graph-backed answers over Kubernetes Enhancement Proposals"
readme = "README.md"
authors = [
    { name = "Akshat Lakhera", email = "akshatlnct2024@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "falkordb==1.8.0",
    "fastapi==0.143.0",
    "httpx==0.28.1",
    "mcp>=2.3.0",
    "openai>=3.31.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "python-ulid>=4.0.1",
    "pyyaml>=6.0.3",
    "sse-starlette>=3.5.0",
    "structlog==26.1.0",
    "uvicorn==0.54.0",
]

[project.scripts]
kep-worker = "app.worker.__main__:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party clients without type information.
module = ["falkordb", "falkordb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: needs the dev FalkorDB instance (throwaway graph names only)",
    "acl: needs a FalkorDB started with an ACL file (aclfile mode)",
]
